<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Core | Дашборд</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  </style>

<body>
  <!-- ... HTML-структура без изменений ... -->

  <script>
    // ... все предыдущие переменные и функции (кроме generateStateText) остаются без изменений ...

    // ===================== Обновлённая функция генерации state.txt =====================
    function generateStateText() {
      syncAllAutoStatuses();

      const сегодня = new Date().toLocaleDateString('ru-RU');
      const index = calcOverallIndex();
      const indexPercent = Math.round(index * 100);

      // Определяем статус системы
      let статусСистемы = '';
      if (indexPercent < 40) статусСистемы = 'Критический';
      else if (indexPercent < 60) статусСистемы = 'Нестабильный';
      else if (indexPercent < 80) статусСистемы = 'Стабильный';
      else статусСистемы = 'Оптимальный';

      // Собираем текст
      let text = `# Состояние системы Obsidian Core на ${сегодня}\n\n`;
      text += `## Obsidian Core Index: ${indexPercent}% (${статусСистемы})\n`;

      // Тренд (если есть хотя бы 2 записи в истории)
      const история = currentData.история || [];
      if (история.length >= 2) {
        const prev = история[история.length - 2];
        const last = история[история.length - 1];
        const prevIndex = Math.round(prev.индекс * 100);
        const lastIndex = Math.round(last.индекс * 100);
        const diff = lastIndex - prevIndex;
        let тренд = '';
        if (diff > 0) тренд = `↗️ Растёт (+${diff}%)`;
        else if (diff < 0) тренд = `↘️ Падает (${diff}%)`;
        else тренд = `↔️ Стабильно`;

        text += `Тренд за 2 дня: ${тренд} (было ${prevIndex}%)\n`;
      } else if (история.length === 1) {
        text += `Тренд: недостаточно данных (нужно 2 сохранения)\n`;
      }

      text += `\n`;

      // Собираем критические точки (статус "плохо")
      const критические = [];
      currentData.фронты.forEach(front => {
        front.параметры.forEach(p => {
          if (p.статус === 'плохо') {
            let значение = '';
            if (p.имя === 'Сон') {
              const duration = calcSleepDuration(p.sleep_bed, p.sleep_wake);
              значение = `${p.sleep_bed} → ${p.sleep_wake} (${duration})`;
            } else if (p.имя === 'Питание') {
              значение = `${p.nutrition_level} приёмов пищи`;
            } else if (p.имя === 'Физнагрузка') {
              значение = p.workout_desc || 'отсутствует';
              if (p.workout_streak) значение += ` (стрик ${p.workout_streak} дн.)`;
            } else if (p.имя === 'Общее ЦНС') {
              значение = `Уровень ${p.уровень}/10`;
            } else if (p.имя === 'Баланс') {
              значение = `${p.capital_balance} ₽`;
            } else if (p.имя === 'Цель') {
              // Для цели в критических точках можно не выводить прогресс
              значение = `${p.capital_goal} ₽`;
            } else if (p.имя === 'Доход за месяц') {
              значение = `${p.capital_income} ₽`;
            } else if (p.имя === 'Несданных долгов') {
              значение = p.debts_count;
            } else {
              значение = p.состояние || '—';
            }
            критические.push(`- ${p.имя}: ${значение} (плохо)`);
          }
        });
      });

      if (критические.length > 0) {
        text += `## 🚨 Критические точки\n`;
        критические.forEach(item => text += item + '\n');
        text += '\n';
      } else {
        text += `## 🚨 Критические точки\n✅ Критических точек нет\n\n`;
      }

      // Детализация по фронтам (как раньше, но с улучшениями)
      currentData.фронты.forEach(front => {
        const { score, max } = calcFrontHealth(front);
        const health = Math.round((score / max) * 100);
        text += `### ${front.название} (здоровье: ${health}%)\n`;
        front.параметры.forEach(p => {
          let value = '';
          if (p.имя === 'Сон') {
            const duration = calcSleepDuration(p.sleep_bed, p.sleep_wake);
            value = `${p.sleep_bed} → ${p.sleep_wake} (продолжительность ${duration}, ${p.статус || 'нейтрально'})`;
          } else if (p.имя === 'Питание') {
            const levels = ['', 'Плохо', 'Средне', 'Хорошо'];
            value = `${p.nutrition_level} приёмов пищи (${p.статус || 'нейтрально'})`;
          } else if (p.имя === 'Физнагрузка') {
            value = `${p.workout_desc || '—'} (стрик ${p.workout_streak} дн.)`;
            if (p.workout_note) value += ` — ${p.workout_note}`;
            value += ` (${p.статус || 'нейтрально'})`;
          } else if (p.имя === 'Общее ЦНС') {
            value = `Уровень ${p.уровень}/10 (${p.статус || 'нейтрально'})`;
            if (p.cns_note) value += ` — ${p.cns_note}`;
          } else if (p.имя === 'Баланс') {
            value = `${p.capital_balance} ₽ (${p.статус || 'нейтрально'})`;
          } else if (p.имя === 'Цель') {
            // Ищем баланс в этом же фронте для прогресса
            const balanceParam = front.параметры.find(par => par.имя === 'Баланс');
            const balance = balanceParam ? balanceParam.capital_balance : 0;
            const goal = p.capital_goal || 0;
            const progress = goal > 0 ? Math.round((balance / goal) * 100) : 0;
            value = `${goal} ₽ (прогресс ${progress}%) (${p.статус || 'нейтрально'})`;
          } else if (p.имя === 'Доход за месяц') {
            value = `${p.capital_income} ₽ (${p.статус || 'нейтрально'})`;
          } else if (p.имя === 'Несданных долгов') {
            value = `${p.debts_count} (${p.статус || 'нейтрально'})`;
          } else {
            value = `${p.состояние || '—'} (${p.статус || 'нейтрально'})`;
          }
          text += `- **${p.имя}**: ${value}\n`;
        });
        text += '\n';
      });

      if (currentData.протоколы) {
        text += `## Протоколы\n${currentData.протоколы}\n\n`;
      }
      if (currentData.цели && currentData.цели.length > 0) {
        text += `## Ежедневные действия\n`;
        currentData.цели.forEach((goal, i) => {
          const done = goal.startsWith('✓') ? '✅' : '⬜';
          text += `${done} ${goal.replace('✓', '')}\n`;
        });
        text += '\n';
      }
      if (история.length > 0) {
        const last = история[история.length - 1];
        text += `## Последнее сохранение: ${last.дата}, индекс ${Math.round(last.индекс * 100)}%\n`;
      }

      return text;
    }

    // ... остальные функции (copyStateToClipboard, uploadStateToGitHub и др.) без изменений ...
  </script>
</body>
</html>
