<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Core | Тест вкладок</title>
  <style>
    body { background: #0a0a0a; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; background: #333; color: #ccc; border: none; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #555; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('overview')">📊 Обзор</button>
    <button class="tab-btn" onclick="switchTab('finance')">💰 Финансы</button>
    <button class="tab-btn" onclick="switchTab('sport')">🏃 Спорт</button>
    <button class="tab-btn" onclick="switchTab('charts')">📈 Графики</button>
  </div>

  <div id="tab-overview" class="tab-content active"><h2>Обзор</h2><p>Здесь будет дашборд</p></div>
  <div id="tab-finance" class="tab-content"><h2>Финансы</h2><p>Здесь будет финансовый модуль</p></div>
  <div id="tab-sport" class="tab-content"><h2>Спорт</h2><p>Здесь будет спортивный модуль</p></div>
  <div id="tab-charts" class="tab-content"><h2>Графики</h2><p>Здесь будут графики</p></div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
