<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Core | Командный центр</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0; line-height: 1.5; padding: 30px 20px;
      min-height: 100vh; position: relative; overflow-x: hidden;
    }
    .bg-text {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: clamp(3rem,12vw,10rem); font-weight: 900;
      color: rgba(255, 255, 255, 0.06);
      text-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
      white-space: nowrap; pointer-events: none; z-index: 0;
      letter-spacing: 0.05em; user-select: none;
    }
    .container { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
    h1 {
      font-size: 2.2rem; font-weight: 600; color: #f0f0f0;
      text-shadow: 0 0 12px rgba(180, 180, 180, 0.3);
      margin-bottom: 5px;
    }
    .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 20px; border: 1px solid rgba(150, 150, 150, 0.3);
      background: rgba(150, 150, 150, 0.1); color: #bbb;
      border-radius: 8px; cursor: pointer; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .tab-btn.active { background: #555; border-color: #777; color: #fff; box-shadow: 0 0 8px rgba(150,150,150,0.2); }
    .tab-btn:hover { background: rgba(150, 150, 150, 0.2); }
    .subtitle { color: #999; margin-bottom: 5px; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .blinking-dot {
      width: 8px; height: 8px; background: #6ee7b7; border-radius: 50%;
      animation: blink 1.5s infinite; box-shadow: 0 0 8px #6ee7b7;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    .core-index {
      display: flex; align-items: center; justify-content: center; gap: 20px;
      margin-bottom: 25px;
    }
    .ring { position: relative; width: 80px; height: 80px; }
    .ring svg { transform: rotate(-90deg); }
    .ring .bg-circle { fill: none; stroke: rgba(150, 150, 150, 0.15); stroke-width: 8; }
    .ring .fg-circle {
      fill: none; stroke: #888; stroke-width: 8;
      stroke-linecap: round; transition: stroke-dashoffset 0.6s;
    }
    .ring .percent {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 1.2rem; font-weight: 600; color: #fff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .system-summary {
      background: rgba(25, 25, 30, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(150, 150, 150, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .system-status {
      font-size: 1.3rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .system-status .dot {
      width: 14px; height: 14px; border-radius: 50%;
    }
    .trend-text { color: #aaa; margin-bottom: 10px; font-size: 0.9rem; }
    .critical-list { list-style: none; padding-left: 0; margin-top: 5px; }
    .critical-list li { padding: 4px 0; font-size: 0.9rem; color: #e05a5a; }
    .critical-list li::before { content: "⚠️ "; }
    .no-critical { color: #5fa88d; font-weight: 500; }
    .streaks-row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .streak-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(150,150,150,0.2);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #ccc;
    }
    .streak-pill span { font-weight: 600; color: #f0f0f0; }
    .series-card {
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(150, 150, 150, 0.12);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .series-item { text-align: center; }
    .series-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 700; color: #fff;
      cursor: pointer; transition: all 0.2s;
      border: 3px solid #444;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      margin: 0 auto 8px;
    }
    .series-circle:hover { transform: scale(1.05); border-color: #888; }
    .series-circle.low { background: #3a3a3a; border-color: #666; }
    .series-circle.mid { background: #5a4a30; border-color: #f0a060; }
    .series-circle.high { background: #2a4a3a; border-color: #5fa88d; }
    .series-label { font-size: 0.85rem; color: #aaa; }

    .card {
      background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(12px);
      border-radius: 16px; padding: 24px; margin-bottom: 20px;
      border: 1px solid rgba(150, 150, 150, 0.12);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 10px rgba(100,100,100,0.1);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      opacity: 0; animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .card:hover { transform: translateY(-4px); border-color: rgba(180, 180, 180, 0.3); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
    .card-header h2 { font-size: 1.1rem; font-weight: 600; color: #ccc; letter-spacing: 0.02em; margin: 0; }
    .mini-bar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .mini-bar-track { flex: 1; height: 6px; background: rgba(150, 150, 150, 0.15); border-radius: 3px; overflow: hidden; }
    .mini-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #666, #999); transition: width 0.5s; }
    .mini-bar-label { font-size: 0.8rem; color: #999; width: 40px; text-align: right; }
    .field { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(150, 150, 150, 0.08); }
    .field:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .field label { width: 120px; font-size: 0.9rem; color: #999; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px currentColor; transition: transform 0.15s, box-shadow 0.15s; }
    .status-dot.manual { cursor: pointer; }
    .status-dot.manual:hover { transform: scale(1.3); }
    .status-плохо { background: #e05a5a; color: #e05a5a; }
    .status-среднее { background: #f0a060; color: #f0a060; }
    .status-хорошо { background: #5fa88d; color: #5fa88d; }
    .status-нейтрально { background: #888; color: #888; }
    input, select, textarea {
      flex: 1; padding: 8px 12px; border: none; border-radius: 6px;
      background: rgba(150, 150, 150, 0.1); color: #ddd;
      font-size: 0.9rem; font-family: inherit;
      border: 1px solid rgba(150, 150, 150, 0.15);
    }
    input:focus, select:focus, textarea:focus { background: rgba(150, 150, 150, 0.2); outline: none; border-color: #888; }
    textarea { resize: vertical; min-height: 50px; }
    .progress-bar { width: 100%; height: 8px; background: rgba(150, 150, 150, 0.15); border-radius: 10px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #666, #999); transition: width 0.4s; }
    .checklist { list-style: none; padding: 0; }
    .checklist li { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .checklist input[type="checkbox"] { width: 18px; height: 18px; accent-color: #888; }
    .buttons-panel { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn {
      padding: 10px 24px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 500; cursor: pointer;
      background: rgba(150, 150, 150, 0.15); color: #ccc;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid rgba(150, 150, 150, 0.25);
    }
    .btn:hover { background: rgba(150, 150, 150, 0.25); transform: translateY(-1px); }
    .btn.primary { background: #555; border-color: #777; }
    .btn.primary:hover { background: #666; }
    .json-preview {
      background: rgba(25, 25, 30, 0.85); border-radius: 8px; padding: 15px;
      margin-top: 15px; font-family: monospace; font-size: 0.8rem;
      white-space: pre-wrap; word-break: break-word;
      max-height: 200px; overflow-y: auto; display: none;
      border: 1px solid rgba(150, 150, 150, 0.2);
    }
    .chart-container {
      background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(12px);
      border-radius: 16px; padding: 20px; margin-bottom: 20px;
      border: 1px solid rgba(150, 150, 150, 0.12);
    }

    /* Стили для финансов и спорта */
    .finance-card, .sport-card {
      background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(12px);
      border-radius: 16px; padding: 15px; margin-bottom: 15px;
      border: 1px solid rgba(150,150,150,0.12);
    }
    .finance-card h3, .sport-card h3 { font-size: 1rem; color: #ccc; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .balance-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .balance-row:last-child { border-bottom: none; }
    .sub-account { padding-left: 20px; font-size: 0.9rem; color: #aaa; }
    .phase-badge { background: #f0a060; color: #000; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .progress-finance { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 5px 0; }
    .progress-finance-fill { height: 100%; border-radius: 4px; background: #5fa88d; }
    .operation-list { max-height: 200px; overflow-y: auto; margin-top: 10px; }
    .operation-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .positive { color: #5fa88d; }
    .negative { color: #e05a5a; }
    .small-btn { padding: 5px 12px; font-size: 0.8rem; margin: 2px; }

    /* Спорт */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #1e1e24; border-radius: 16px; padding: 24px; max-width: 500px; width: 90%; border: 1px solid rgba(150,150,150,0.3); max-height: 80vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; }
    .exercise-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .exercise-row input, .exercise-row select { flex: 1; min-width: 80px; }
    .pain-slider { display: flex; gap: 5px; align-items: center; }
    .pain-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(150,150,150,0.3); color: #ccc; cursor: pointer; font-size: 0.9rem; }
    .pain-btn.active { background: #e05a5a; color: #fff; border-color: #e05a5a; }
    .history-item { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
    .delete-btn { background: none; border: none; color: #e05a5a; cursor: pointer; margin-left: 10px; }
  </style>
</head>
<body>
  <div class="bg-text">Obsidian Core System 2</div>
  <div class="container">
    <h1>⚡ Obsidian Core v2.0</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('overview')">📊 Обзор</button>
      <button class="tab-btn" onclick="switchTab('finance')">💰 Финансы</button>
      <button class="tab-btn" onclick="switchTab('sport')">🏃 Спорт</button>
      <button class="tab-btn" onclick="switchTab('charts')">📈 Графики</button>
    </div>
    <p class="subtitle"><span id="currentDate"></span><span class="blinking-dot"></span></p>

    <!-- Обзор -->
    <div id="tab-overview" class="tab-content active">
      <div class="core-index">
        <div class="ring">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle class="bg-circle" cx="40" cy="40" r="34"/>
            <circle id="coreRing" class="fg-circle" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
          </svg>
          <div class="percent" id="corePercent">0%</div>
        </div>
        <span style="color:#999;">Obsidian Core Index</span>
      </div>
      <div id="systemSummary" class="system-summary"></div>
      <div id="miniCards" style="display:flex; gap:12px; margin-bottom:20px;"></div>
      <div id="seriesContainer"></div>
      <div id="frontsContainer"></div>
      <div class="buttons-panel">
        <button class="btn primary" onclick="CoreApp.saveAll()">💾 Сохранить всё</button>
        <button class="btn" onclick="CoreApp.toggleJson()">📋 Показать JSON</button>
        <button class="btn" onclick="CoreApp.resetToJson()">🔄 Сбросить из JSON</button>
        <button class="btn" onclick="CoreApp.copyStateToClipboard()">📋 Скопировать state для чата</button>
      </div>
      <div id="jsonPreview" class="json-preview"></div>
    </div>

    <!-- Финансы -->
    <div id="tab-finance" class="tab-content">
      <div id="financeContainer"></div>
    </div>

    <!-- Спорт -->
    <div id="tab-sport" class="tab-content">
      <div id="sportContainer"></div>
    </div>

    <!-- Графики -->
    <div id="tab-charts" class="tab-content">
      <div class="chart-container"><h2 style="margin-bottom:15px; color:#ccc;">📈 Obsidian Core Index (история)</h2><canvas id="indexChart" width="400" height="200"></canvas></div>
      <div class="chart-container"><h2 style="margin-bottom:15px; color:#ccc;">🧩 Здоровье фронтов</h2><canvas id="frontsChart" width="400" height="250"></canvas></div>
      <button class="btn" onclick="CoreApp.clearHistory()" style="margin-top:10px;">🗑️ Очистить историю</button>
    </div>
  </div>

  <!-- Модальное окно тренировки -->
  <div id="trainingModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="SportApp.closeTrainingForm()">&times;</button>
      <h3 style="margin-bottom:15px;">Запись тренировки</h3>
      <div id="exerciseList"></div>
      <button class="btn" onclick="SportApp.addExerciseField()" style="margin-bottom:10px;">+ Добавить упражнение</button>
      <div style="margin:10px 0;">Боль в локте (0-5): <span id="painValue">0</span></div>
      <div class="pain-slider">
        <button class="pain-btn" onclick="SportApp.setPain(0)">0</button><button class="pain-btn" onclick="SportApp.setPain(1)">1</button><button class="pain-btn" onclick="SportApp.setPain(2)">2</button><button class="pain-btn" onclick="SportApp.setPain(3)">3</button><button class="pain-btn" onclick="SportApp.setPain(4)">4</button><button class="pain-btn" onclick="SportApp.setPain(5)">5</button>
      </div>
      <div style="margin:10px 0;"><label><input type="checkbox" id="isRestDay"> Разгрузочный день</label><label style="margin-left:10px;"><input type="checkbox" id="isTestDay"> Тест на максимум</label></div>
      <textarea id="trainingNotes" placeholder="Заметки" style="width:100%; margin-bottom:10px;"></textarea>
      <button class="btn primary" onclick="SportApp.saveTraining()">💾 Сохранить тренировку</button>
    </div>
  </div>  <script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let currentData = null;
    let financeData = null;
    let sportData = null;

    const MANUAL_CYCLE = ['нейтрально', 'плохо', 'среднее', 'хорошо'];
    let indexChartInstance = null, frontsChartInstance = null;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'overview') CoreApp.renderAll();
      else if (tabName === 'finance') FinanceApp.render();
      else if (tabName === 'sport') SportApp.render();
      else if (tabName === 'charts') CoreApp.renderCharts();
    }

    // ========== МОДУЛЬ CORE (обзор) ==========
    const CoreApp = {
      init() {
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ru-RU', { weekday:'short', year:'numeric', month:'long', day:'numeric' });
        const saved = localStorage.getItem('obsidian_core');
        if (saved) { try { currentData = JSON.parse(saved); } catch(e){} }
        if (!currentData) {
          try { fetch('data.json').then(r=>r.json()).then(d=>{ currentData = d; if(!currentData.история) currentData.история = []; if(!currentData.серии) currentData.серии = {сон:0,питание:0,активность:0,тело:0}; this.convertOldStatuses(); this.ensureAllStatuses(); this.syncAllAutoStatuses(); this.renderAll(); }); return; } catch(e){}
          currentData = this.getEmptyStructure();
        }
        if (!currentData.история) currentData.история = [];
        if (!currentData.серии) currentData.серии = { сон:0, питание:0, активность:0, тело:0 };
        this.convertOldStatuses(); this.ensureAllStatuses(); this.syncAllAutoStatuses();
        FinanceApp.load(); SportApp.load();
        this.renderAll();
      },
      getEmptyStructure() {
        return {
          дата: new Date().toISOString().slice(0,10),
          серии: { сон: 0, питание: 0, активность: 0, тело: 0 },
          фронты: [
            { название: "0.4 — ЦНС и тело", параметры: [
              { имя: "Сон", sleep_bed: "23:30", sleep_wake: "07:00" },
              { имя: "Питание", nutrition_level: 2 },
              { имя: "Физнагрузка", workout_desc: "", workout_streak: 0, workout_note: "", статус: "среднее" },
              { имя: "Общее ЦНС", уровень: 4.5, cns_note: "" } ] },
            { название: "1 — Магазин / Студия", параметры: [
              { имя: "Магазин «СКИФ»", статус: "плохо", состояние: "" },
              { имя: "Студия автосвета", статус: "среднее", состояние: "" } ] },
            { название: "0.1 — Капитал", параметры: [
              { имя: "Баланс", capital_balance: 65000 },
              { имя: "Цель", capital_goal: 100000, статус: "среднее" },
              { имя: "Доход за месяц", capital_income: 0 } ] },
            { название: "2 — Учёба", параметры: [
              { имя: "Статус учёбы", статус: "нейтрально", состояние: "Каникулы" },
              { имя: "Несданных долгов", debts_count: 0 },
              { имя: "Ближайший экзамен", состояние: "" } ] },
            { название: "3 — Социум / Отношения", параметры: [
              { имя: "Вероника", статус: "нейтрально", состояние: "" },
              { имя: "Максы", статус: "нейтрально", состояние: "" },
              { имя: "Брат", статус: "нейтрально", состояние: "" },
              { имя: "Общий фон", статус: "нейтрально", состояние: "" } ] },
            { название: "4 — Хобби / Творчество", параметры: [
              { имя: "Канал автосвета", статус: "среднее", состояние: "" },
              { имя: "Obsidian Core версия", состояние: "v2.0" },
              { имя: "Что изучал", состояние: "" } ] }
          ],
          протоколы: "", цели: ["Вода, завтрак, подход", "Одно действие по магазину/студии", "Вечерний отчёт"], история: []
        };
      },
      escapeHtml(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
      sleepStatus(bed, wake) { if(!bed||!wake) return 'нейтрально'; const [bh,bm]=bed.split(':').map(Number); const [wh,wm]=wake.split(':').map(Number); let bedMins=bh*60+bm, wakeMins=wh*60+wm; if(wakeMins<=bedMins) wakeMins+=24*60; const d=(wakeMins-bedMins)/60; if(d<6)return'плохо'; if(d<7)return'среднее'; if(d<=9)return'хорошо'; return'нейтрально'; },
      nutritionStatus(l) { if(l<=0)return'плохо'; if(l===1)return'среднее'; return'хорошо'; },
      cnsStatus(l) { if(l<=3)return'плохо'; if(l<=6)return'среднее'; return'хорошо'; },
      balanceStatus(bal,goal) { if(!goal||goal===0)return'нейтрально'; const p=bal/goal; if(p>=.8)return'хорошо'; if(p>=.5)return'среднее'; return'плохо'; },
      incomeStatus(inc) { return inc>0?'хорошо':'плохо'; },
      debtsStatus(c) { if(c===0)return'хорошо'; if(c<=2)return'среднее'; return'плохо'; },
      calcSleepDuration(bed, wake) { if(!bed||!wake)return'(не указано)'; const [bh,bm]=bed.split(':').map(Number); const [wh,wm]=wake.split(':').map(Number); let bedMins=bh*60+bm, wakeMins=wh*60+wm; if(wakeMins<=bedMins) wakeMins+=24*60; const diff=wakeMins-bedMins; if(diff===0)return'(не указано)'; const h=Math.floor(diff/60), m=diff%60; return `${h}ч ${m}м`; },
      convertOldStatuses() { const map={'критично':'плохо','нет':'плохо','держится':'хорошо','сохранён':'хорошо','угасла':'среднее','пауза':'среднее','хрупкое':'среднее','нейтрально':'нейтрально'}; currentData.фронты.forEach(f=>f.параметры.forEach(p=>{if(p.статус&&map[p.статус])p.статус=map[p.статус]})); },
      ensureAllStatuses() { currentData.фронты.forEach(f=>f.параметры.forEach(p=>{if(!p.статус){if(p.уровень!==undefined)p.статус=this.cnsStatus(p.уровень);else if(p.sleep_bed!==undefined)p.статус=this.sleepStatus(p.sleep_bed,p.sleep_wake);else if(p.nutrition_level!==undefined)p.статус=this.nutritionStatus(p.nutrition_level);else if(p.capital_balance!==undefined){const g=f.параметры.find(x=>x.имя==='Цель')?.capital_goal||0;p.статус=this.balanceStatus(p.capital_balance,g);}else if(p.capital_income!==undefined)p.статус=this.incomeStatus(p.capital_income);else if(p.debts_count!==undefined)p.статус=this.debtsStatus(p.debts_count);else p.статус='нейтрально';}})); },
      syncAllAutoStatuses() { currentData.фронты.forEach(f=>{let bal=null,g=null;if(f.название==="0.1 — Капитал"){f.параметры.forEach(p=>{if(p.имя==="Баланс")bal=p.capital_balance;if(p.имя==="Цель")g=p.capital_goal;});} f.параметры.forEach(p=>{if(p.имя==='Сон')p.статус=this.sleepStatus(p.sleep_bed,p.sleep_wake);else if(p.имя==='Питание')p.статус=this.nutritionStatus(p.nutrition_level);else if(p.имя==='Общее ЦНС')p.статус=this.cnsStatus(p.уровень);else if(p.имя==='Баланс')p.статус=this.balanceStatus(p.capital_balance,g);else if(p.имя==='Доход за месяц')p.статус=this.incomeStatus(p.capital_income);});}); },
      calcFrontHealth(front) { let total=0,count=0; const ss={'хорошо':8,'нейтрально':6,'среднее':4,'плохо':1}; front.параметры.forEach(p=>{if(p.уровень!==undefined){total+=p.уровень;count++;}else if(p.имя==='Сон'){total+=ss[p.статус]||5;count++;}else if(p.имя==='Питание'){total+=ss[p.статус]||5;count++;}else if(p.имя==='Баланс'){total+=ss[p.статус]||5;count++;}else if(p.имя==='Цель'){total+=5;count++;}else if(p.имя==='Доход за месяц'){total+=ss[p.статус]||5;count++;}else if(p.имя==='Несданных долгов'){total+=ss[p.статус]||5;count++;}else{total+=ss[p.статус]||5;count++;}}); return {score:total, max:count*10}; },
      updateSystemSummary() { const el=document.getElementById('systemSummary'); if(!el)return; const idx=Math.round(this.calcOverallIndex()*100); let status='',col=''; if(idx<40){status='Критический';col='#e05a5a';}else if(idx<60){status='Нестабильный';col='#f0a060';}else if(idx<80){status='Стабильный';col='#5fa88d';}else{status='Оптимальный';col='#888';} let html=`<div class="system-status"><span class="dot" style="background:${col};"></span> ${status} (${idx}%)</div>`; const hist=currentData.история||[]; if(hist.length>=2){const prev=hist[hist.length-2],last=hist[hist.length-1];const diff=Math.round(last.индекс*100)-Math.round(prev.индекс*100);let trend='';if(diff>0)trend=`↗️ Растёт (+${diff}%)`;else if(diff<0)trend=`↘️ Падает (${diff}%)`;else trend='↔️ Стабильно';html+=`<div class="trend-text">Тренд: ${trend} (было ${Math.round(prev.индекс*100)}%)</div>`;}else if(hist.length===1)html+=`<div class="trend-text">Тренд: недостаточно данных</div>`; const crit=[]; currentData.фронты.forEach(f=>f.параметры.forEach(p=>{if(p.статус==='плохо'){let v='';if(p.имя==='Сон')v=`${p.sleep_bed} → ${p.sleep_wake} (${this.calcSleepDuration(p.sleep_bed,p.sleep_wake)})`;else if(p.имя==='Питание')v=`${p.nutrition_level} приёмов`;else if(p.имя==='Физнагрузка')v=p.workout_desc||'отсутствует';else if(p.имя==='Общее ЦНС')v=`Уровень ${p.уровень}/10`;else if(p.имя==='Баланс')v=`${p.capital_balance} ₽`;else if(p.имя==='Цель')v=`${p.capital_goal} ₽`;else if(p.имя==='Доход за месяц')v=`${p.capital_income} ₽`;else if(p.имя==='Несданных долгов')v=p.debts_count;else v=p.состояние||'—';crit.push(`${p.имя}: ${v}`);}})); if(crit.length>0){html+=`<div style="margin-top:8px; font-weight:600; color:#e05a5a;">🚨 Критические точки</div><ul class="critical-list">`;crit.forEach(i=>html+=`<li>${i}</li>`);html+=`</ul>`;}else html+=`<div class="no-critical" style="margin-top:8px;">✅ Критических точек нет</div>`; const series=currentData.серии||{}; html+=`<div class="streaks-row">`; [{key:'сон',icon:'🌙',label:'Сон'},{key:'питание',icon:'🍏',label:'Питание'},{key:'активность',icon:'⚡',label:'Активность'},{key:'тело',icon:'💪',label:'Тело'}].forEach(i=>html+=`<div class="streak-pill">${i.icon} ${i.label}: <span>${series[i.key]||0} дн.</span></div>`); html+=`</div>`; el.innerHTML=html; },
      renderSeries() { const el=document.getElementById('seriesContainer'); if(!el)return; const s=currentData.серии||{сон:0,питание:0,активность:0,тело:0}; const circleClass=v=>v>=7?'high':v>=3?'mid':'low'; const items=[{key:'сон',icon:'🌙',label:'Сон'},{key:'питание',icon:'🍏',label:'Питание'},{key:'активность',icon:'⚡',label:'Активность'},{key:'тело',icon:'💪',label:'Тело'}]; let html='<div class="series-card">'; items.forEach(i=>{const v=s[i.key]||0; html+=`<div class="series-item"><div class="series-circle ${circleClass(v)}" onclick="CoreApp.editSeries('${i.key}')">${v}</div><div class="series-label">${i.icon} ${i.label}</div></div>`;}); html+='</div>'; el.innerHTML=html; },
      editSeries(key) {
        if (key === 'тело') return; // теперь серия "Тело" только из спорта
        const v = prompt(`Новое значение для "${key}":`, currentData.серии[key]);
        if (v !== null) {
          const n = parseInt(v);
          if (!isNaN(n) && n >= 0) {
            currentData.серии[key] = n;
            this.renderSeries();
            this.updateSystemSummary();
          }
        }
      },
      // Новая функция синхронизации данных из других модулей
      syncFromModules() {
        // 1. Синхронизация финансов -> фронт 0.1
        if (financeData) {
          const f = financeData;
          const totalBalance = (f.счета?.железный?.баланс||0) + (f.счета?.крепость?.баланс||0) + (f.счета?.живой?.баланс||0) + (f.счета?.жизнь?.баланс||0) - (f.счета?.долг?.баланс||0);
          const capitalFront = currentData.фронты[2]; // 0.1 — Капитал
          capitalFront.параметры[0].capital_balance = totalBalance; // Баланс
          capitalFront.параметры[1].capital_goal = f.цель_мотоцикл?.бюджет || 100000; // Цель
          capitalFront.параметры[2].capital_income = f.доход_будущий_мес_брутто || 0; // Доход
        }
        // 2. Синхронизация спорта -> серия "Тело", физнагрузка
        if (sportData && SportApp.getActiveStreak) {
          const streakInfo = SportApp.getActiveStreak();
          currentData.серии.тело = streakInfo.count;
          const workoutParam = currentData.фронты[0].параметры[2]; // Физнагрузка
          workoutParam.workout_streak = streakInfo.count;
          // Автостатус физнагрузки: если сегодня была тренировка, то хорошо, иначе нейтрально
          const todayTraining = SportApp.getTodayTraining ? SportApp.getTodayTraining() : null;
          if (todayTraining && !todayTraining.isRestDay) {
            workoutParam.статус = 'хорошо';
          } else {
            workoutParam.статус = 'нейтрально';
          }
          // Также обновим описание из последней тренировки
          if (sportData.тренировки?.length) {
            const lastTraining = sportData.тренировки[0];
            workoutParam.workout_desc = lastTraining.exercises.map(e => `${e.name} ${e.sets}x${e.reps}`).join(', ');
            workoutParam.workout_note = lastTraining.notes || '';
          }
        }
      },
      renderAll() {
        this.syncFromModules(); // синхронизируем данные из финансов и спорта

        (currentData.цели||[]).forEach((g,i) => html += `<li><input type="checkbox" ${g.startsWith('✓')?'checked':''} onchange="CoreApp.toggleGoal(${i})"><input type="text" value="${this.escapeHtml(g.replace('✓',''))}" onchange="CoreApp.updateGoal(${i},this.value)"></li>`);

      renderParameter(fi, pi, p, front) {

        const status = p.статус || 'нейтрально';
        const isAuto = ['Сон', 'Питание', 'Общее ЦНС', 'Баланс', 'Доход за месяц', 'Физнагрузка'].includes(p.имя);
        const click = isAuto ? '' : `onclick="CoreApp.cycleStatus(${fi},${pi})"`;
        h += `<div class="field"><label><span class="status-dot status-${status} ${isAuto?'':'manual'}" ${click} title="${isAuto?'Авто: '+status:status}"></span>${p.имя}</label>`;
        if (p.имя === 'Сон') {
